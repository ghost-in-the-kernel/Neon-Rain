# Tool configuration only: Neon Rain is not a package to install (R-001, R-017).

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
addopts = "-q -m 'not slow'"
markers = ["slow: the harness on the synthetic market, its own budget (AGENT.md); scripts/precommit.sh runs it"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# R-015(b), the part a linter can say: type hints on every function (ANN), no bare except (E722),
# the common bug patterns (B). The rest of R-015(b) (functions under 40 lines, comprehensions of at
# most three clauses, no *args or **kwargs) is scripts/checks/readability.py, held by
# test/test_readability.py.
select = ["E4", "E7", "E9", "F", "ANN", "B"]
# B905 (zip without strict=) is off: mutmut flips strict= to its default, a mutant no test can tell apart, and a
# short table row is a reported problem here, not a crash.
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/probe/reachability.py" = ["E501"]

[tool.mutmut]
# R-015(a): every line the tests are trusted to hold.
source_paths = ["scripts/checks/", "neonrain/"]
# Workers fork from a clean server, not from the process that ran the suite: polars's thread pool does not
# survive a fork, and forked mutants of the synthetic market deadlocked into timeouts (J-013).
process_isolation = "forkserver"
# The doc tests read the documents themselves, so the copy mutmut tests in carries them.
also_copy = ["docs/", "data/", "harness/", "theGhost.md", "TODO.md", "CLAUDE.md", "README.md", "requirements.lock", "scripts/probe/", "scripts/metrics.py"]
